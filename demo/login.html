<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Login — QA demo</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; background: #f2f5f8; color: #172b42; margin: 0; }
    main { max-width: 360px; margin: 10vh auto; padding: 32px; background: white; border: 1px solid #d6e0e9; border-radius: 12px; }
    h1 { margin: 0 0 8px; } p { color: #536578; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #8a9bab; border-radius: 5px; font: inherit; }
    button { width: 100%; margin-top: 24px; padding: 11px; border: 0; border-radius: 5px; background: #175c72; color: white; font: inherit; cursor: pointer; }
    [role=status] { min-height: 24px; margin-top: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>User Login</h1>
    <p>AI QA assessment demo</p>
    <form novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <div role="status" aria-live="polite"></div>
  </main>
  <script>
    document.querySelector('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const status = document.querySelector('[role=status]');
      status.textContent = '';
      try {
        const response = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.querySelector('#username').value, password: document.querySelector('#password').value }),
        });
        status.textContent = (await response.json()).message;
      } catch { status.textContent = 'Service unavailable'; }
    });
  </script>
</body>
</html>
